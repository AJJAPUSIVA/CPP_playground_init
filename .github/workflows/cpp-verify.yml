name: C++17 CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify environment
        run: |
          g++ --version
          make --version

      - name: Compile and run all 220 tests
        run: make verify